<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Чат</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --chat-bg: #f0f2f5;
            --user-msg-color: #0084ff;
            --ai-msg-color: #e4e6eb;
            --text-color: #050505;
            --white-color: #ffffff;
            --input-bg: #f0f2f5;
            --border-color: #d1d1d6;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background-color: var(--chat-bg);
            display: flex;
            flex-direction: column;
        }
        .message {
            max-width: 85%;
            padding: 10px 15px;
            border-radius: 20px;
            margin-bottom: 10px;
            line-height: 1.4;
            word-wrap: break-word;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05);
        }
        .user {
            background-color: var(--user-msg-color);
            color: var(--white-color);
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }
        .ai {
            background-color: var(--ai-msg-color);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }
        .loading {
            align-self: flex-start;
            padding: 10px 15px;
        }
        .loading span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #999;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loading span:nth-child(1) { animation-delay: -0.32s; }
        .loading span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
        #form-container {
            padding: 10px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
        }
        #input {
            flex: 1;
            border: none;
            padding: 12px 18px;
            border-radius: 22px;
            font-size: 16px;
            background-color: var(--input-bg);
        }
        #input:focus { outline: none; }
        #send-btn {
            border: none;
            background-color: var(--user-msg-color);
            color: var(--white-color);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            margin-left: 10px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }
        #send-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>
    <div id="chat-container">
        <div class="message ai">Здравствуйте! Чем могу помочь?</div>
    </div>
    <div id="form-container">
        <input id="input" autocomplete="off" placeholder="Напишите сообщение..." />
        <button id="send-btn" aria-label="Отправить">➤</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const form = document.querySelector('form');
        const input = document.getElementById('input');
// =========================================================================
        // !!! ВАЖНО: ЗАМЕНИТЕ ЭТОТ URL НА АДРЕС ВАШЕГО РАБОТАЮЩЕГО BACKEND-СЕРВЕРА !!!
        // Например, с PythonAnywhere, как в инструкции
        // =========================================================================
        const BACKEND_URL = 'https://focc.pythonanywhere.com/';
        // =========================================================================

        form.addEventListener('submit', handleFormSubmit);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleFormSubmit(e);
            }
        });

        async function handleFormSubmit(e) {
            e.preventDefault();
            const userMessage = input.value.trim();
            if (!userMessage) return;

            addMessage(userMessage, 'user');
            input.value = '';
            showLoadingIndicator();

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userMessage })
                });

                removeLoadingIndicator();
                const data = await response.json();

                if (response.ok && data.reply) {
                    addMessage(data.reply, 'ai');
                } else {
                    addMessage(data.error || 'Произошла ошибка на сервере', 'ai');
                }

            } catch (error) {
                removeLoadingIndicator();
                addMessage('Ошибка сети. Убедитесь, что ваш сервер запущен и доступен.', 'ai');
            }
        }

        function addMessage(text, type) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', type);
            messageElement.textContent = text;
            chatContainer.appendChild(messageElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showLoadingIndicator() {
            const loadingElement = document.createElement('div');
            loadingElement.classList.add('loading');
            loadingElement.id = 'loading-indicator';
            loadingElement.innerHTML = '<span></span><span></span><span></span>';
            chatContainer.appendChild(loadingElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeLoadingIndicator() {
            const loadingElement = document.getElementById('loading-indicator');
            if (loadingElement) {
                loadingElement.remove();
            }
        }
    </script>
</body>
</html>
